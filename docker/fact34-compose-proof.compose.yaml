services:
  proof-provider:
    build:
      context: .
      target: app
    command: ["node", "scripts/fact-34-openclaw-proof-provider.mjs"]
    environment:
      PORT: "18080"
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:18080/healthz').then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))\""]
      interval: 2s
      timeout: 3s
      retries: 30

  openclaw:
    environment:
      ORBITFLOW_OPENCLAW_BASE_URL: http://proof-provider:18080/v1
    depends_on:
      proof-provider:
        condition: service_healthy

  engine:
    environment:
      ORBITFLOW_OPENCLAW_MODULE: /app/test/runtime/fixtures/fake-openclaw.mjs
      ORBITFLOW_ENGINE_POLL_INTERVAL_MS: "25"
    volumes:
      - ./test/runtime/fixtures/fact-34-plan.json:/var/lib/orbitflow/runtime/state/fake-plan.json:ro
