services:
  postgres:
    image: postgres:16.8-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB in .env}
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 5s
    networks: [control]

  migrate:
    build:
      context: .
      target: app
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:?set POSTGRES_USER in .env}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@postgres:5432/${POSTGRES_DB:?set POSTGRES_DB in .env}
    command: ["npm", "run", "db:migrate"]
    depends_on:
      postgres:
        condition: service_healthy
    networks: [control]

  app:
    build:
      context: .
      target: app
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:?set POSTGRES_USER in .env}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@postgres:5432/${POSTGRES_DB:?set POSTGRES_DB in .env}
      ORBITFLOW_OPERATOR_USERNAME: ${ORBITFLOW_OPERATOR_USERNAME:?set ORBITFLOW_OPERATOR_USERNAME in .env}
      ORBITFLOW_OPERATOR_PASSWORD: ${ORBITFLOW_OPERATOR_PASSWORD:?set ORBITFLOW_OPERATOR_PASSWORD in .env}
    ports:
      - "127.0.0.1:${ORBITFACTORY_APP_PORT:-}:3000"
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:3000/api/health').then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))\""]
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 10s
    networks: [control]

  coding-executor:
    build:
      context: .
      target: coding-executor
    environment:
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:?set OPENROUTER_API_KEY in .env}
      ORBITFLOW_CODING_EXECUTOR_PORT: 3005
      ORBITFLOW_CODING_EXECUTOR_TOKEN: ${ORBITFLOW_CODING_EXECUTOR_TOKEN:-local-coding-executor-token}
      ORBITFLOW_CODING_EXECUTOR_ROOT: /tmp/orbitflow-coding-executor
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:3005/healthz').then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))\""]
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 5s
    networks: [provider]

  tool-broker:
    build:
      context: .
      target: tool-broker
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:?set POSTGRES_USER in .env}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@postgres:5432/${POSTGRES_DB:?set POSTGRES_DB in .env}
      ORBITFLOW_TOOL_BROKER_PORT: 3003
      ORBITFLOW_TOOL_BROKER_TOKEN: ${ORBITFLOW_TOOL_BROKER_TOKEN:-local-tool-broker-token}
      ORBITFLOW_TOOL_BROKER_REMOTE_CONTEXT: "1"
      ORBITFLOW_AGENT_WORKSPACE_ROOT: /var/lib/orbitflow/runtime/workspaces
      ORBITFLOW_CODING_EXECUTOR_URL: http://coding-executor:3005
      ORBITFLOW_CODING_EXECUTOR_TOKEN: ${ORBITFLOW_CODING_EXECUTOR_TOKEN:-local-coding-executor-token}
      ORBITFLOW_WORKSPACE_ROOT: /var/lib/orbitflow/run-workspaces
    volumes:
      - run-workspaces:/var/lib/orbitflow/run-workspaces
    depends_on:
      migrate:
        condition: service_completed_successfully
      coding-executor:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:3003/healthz').then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))\""]
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 5s
    networks: [control, provider]

  openclaw:
    build:
      context: .
      target: openclaw-gateway
    environment:
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:?set OPENROUTER_API_KEY in .env}
      OPENCLAW_DISABLE_BONJOUR: "1"
      ORBITFLOW_RUNTIME_RPC_PORT: 3004
      ORBITFLOW_RUNTIME_RPC_TOKEN: ${ORBITFLOW_RUNTIME_RPC_TOKEN:-local-runtime-rpc-token}
      ORBITFLOW_RUNTIME_ROOT: /var/lib/orbitflow/runtime
      ORBITFLOW_TOOL_BROKER_URL: http://tool-broker:3003
      ORBITFLOW_TOOL_BROKER_TOKEN: ${ORBITFLOW_TOOL_BROKER_TOKEN:-local-tool-broker-token}
    volumes:
      - openclaw-state:/home/node/.openclaw
      - openclaw-runtime-data:/var/lib/orbitflow/runtime
    depends_on:
      migrate:
        condition: service_completed_successfully
      tool-broker:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "/usr/local/bin/orbitflow-openclaw-healthcheck"]
      interval: 2s
      timeout: 15s
      retries: 30
      start_period: 15s
    networks: [control, provider]

  engine:
    build:
      context: .
      target: engine
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:?set POSTGRES_USER in .env}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@postgres:5432/${POSTGRES_DB:?set POSTGRES_DB in .env}
      ORBITFLOW_OPENCLAW_RUNTIME_URL: http://openclaw:3004
      ORBITFLOW_OPENCLAW_RUNTIME_TOKEN: ${ORBITFLOW_RUNTIME_RPC_TOKEN:-local-runtime-rpc-token}
      ORBITFLOW_RUNTIME_ROOT: /var/lib/orbitflow/runtime
      ORBITFLOW_WORKSPACE_ROOT: /var/lib/orbitflow/run-workspaces
    volumes:
      - engine-data:/var/lib/orbitflow/runtime
      - run-workspaces:/var/lib/orbitflow/run-workspaces
    ports:
      - "127.0.0.1:${ORBITFACTORY_ENGINE_HOST_PORT:-}:3001"
    depends_on:
      app:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      openclaw:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:3001/readyz').then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))\""]
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 5s
    networks: [control]

  telegram:
    profiles: ["telegram"]
    restart: unless-stopped
    build:
      context: .
      target: app
    command: ["node", "--experimental-strip-types", "src/runtime/telegram.ts"]
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:?set POSTGRES_USER in .env}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@postgres:5432/${POSTGRES_DB:?set POSTGRES_DB in .env}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
    depends_on:
      engine:
        condition: service_healthy
    networks: [control]

  # This standalone proof boundary is deliberately opt-in. Production provider
  # credentials are scoped to openclaw and coding-executor; engine and
  # tool-broker receive none.
  coding-adapter:
    profiles: ["coding-adapter"]
    build:
      context: .
      target: engine
    environment:
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:?set OPENROUTER_API_KEY in .env}
      # The proof selects its committed fake binary through its isolated
      # --env-file. Evaluators omit this optional value and use `opencode`.
      ORBITFACTORY_CODING_ADAPTER_BINARY: ${ORBITFACTORY_CODING_ADAPTER_BINARY:-opencode}
    entrypoint: ["/usr/local/bin/orbitflow-coding-adapter-entrypoint"]
    command: []
    depends_on:
      engine:
        condition: service_healthy
    networks: [control, provider]

networks:
  control: {}
  provider: {}

volumes:
  engine-data:
  openclaw-runtime-data:
  run-workspaces:
  openclaw-state:
  postgres-data:
