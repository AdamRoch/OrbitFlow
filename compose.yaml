name: orbitflow-v2
services:
  postgres:
    image: postgres:17.6-alpine
    environment:
      POSTGRES_USER: orbitflow
      POSTGRES_PASSWORD: orbitflow-local
      POSTGRES_DB: orbitflow
    ports:
      - "127.0.0.1:54329:5432"
    volumes:
      - orbitflow_v2_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U orbitflow -d orbitflow"]
      interval: 2s
      timeout: 2s
      retries: 30
volumes:
  orbitflow_v2_pg:
