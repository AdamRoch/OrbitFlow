services:
  postgres:
    image: postgres:16.8-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB in .env}
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 5s
    networks: [control]

  migrate:
    build:
      context: .
      target: app
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:?set POSTGRES_USER in .env}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@postgres:5432/${POSTGRES_DB:?set POSTGRES_DB in .env}
    command: ["npm", "run", "db:migrate"]
    depends_on:
      postgres:
        condition: service_healthy
    networks: [control]

  app:
    build:
      context: .
      target: app
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:?set POSTGRES_USER in .env}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@postgres:5432/${POSTGRES_DB:?set POSTGRES_DB in .env}
    ports:
      - "127.0.0.1:${ORBITFACTORY_APP_PORT:?set ORBITFACTORY_APP_PORT in .env}:3000"
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:3000/api/health').then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))\""]
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 10s
    networks: [control]

  coding-executor:
    build:
      context: .
      target: coding-executor
    environment:
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:?set OPENROUTER_API_KEY in .env}
      ORBITFLOW_CODING_EXECUTOR_SOCKET: /run/orbitflow-executor/executor.sock
      ORBITFLOW_WORKSPACE_ROOT: /var/lib/orbitflow/run-workspaces
    volumes:
      - run-workspaces:/var/lib/orbitflow/run-workspaces
      - coding-executor-ipc:/run/orbitflow-executor
    healthcheck:
      test: ["CMD-SHELL", "test -S /run/orbitflow-executor/executor.sock"]
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 5s
    networks: [provider]

  tool-broker:
    build:
      context: .
      target: tool-broker
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:?set POSTGRES_USER in .env}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@postgres:5432/${POSTGRES_DB:?set POSTGRES_DB in .env}
      ORBITFLOW_AGENT_WORKSPACE_ROOT: /var/lib/orbitflow/runtime/workspaces
      ORBITFLOW_CODING_EXECUTOR_SOCKET: /run/orbitflow-executor/executor.sock
      ORBITFLOW_TOOL_BROKER_SOCKET: /run/orbitflow-broker/tool.sock
      ORBITFLOW_WORKSPACE_ROOT: /var/lib/orbitflow/run-workspaces
    volumes:
      - engine-data:/var/lib/orbitflow/runtime
      - run-workspaces:/var/lib/orbitflow/run-workspaces
      - tool-broker-ipc:/run/orbitflow-broker
      - coding-executor-ipc:/run/orbitflow-executor
    depends_on:
      migrate:
        condition: service_completed_successfully
      coding-executor:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "test -S /run/orbitflow-broker/tool.sock"]
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 5s
    networks: [control]

  openclaw:
    build:
      context: .
      target: openclaw-gateway
    environment:
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:?set OPENROUTER_API_KEY in .env}
      OPENCLAW_DISABLE_BONJOUR: "1"
      ORBITFLOW_AGENT_WORKSPACE_ROOT: /var/lib/orbitflow/runtime/workspaces
      ORBITFLOW_TOOL_BROKER_SOCKET: /run/orbitflow-broker/tool.sock
    volumes:
      - engine-data:/var/lib/orbitflow/runtime
      - openclaw-state:/home/node/.openclaw
      - tool-broker-ipc:/run/orbitflow-broker
    depends_on:
      migrate:
        condition: service_completed_successfully
      tool-broker:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:18789/readyz').then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))\""]
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 15s
    networks: [control, provider]

  engine:
    build:
      context: .
      target: engine
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:?set POSTGRES_USER in .env}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@postgres:5432/${POSTGRES_DB:?set POSTGRES_DB in .env}
      OPENCLAW_GATEWAY_URL: ws://openclaw:18789
      ORBITFLOW_RUNTIME_ROOT: /var/lib/orbitflow/runtime
      ORBITFLOW_WORKSPACE_ROOT: /var/lib/orbitflow/run-workspaces
    volumes:
      - engine-data:/var/lib/orbitflow/runtime
      - run-workspaces:/var/lib/orbitflow/run-workspaces
      - openclaw-state:/run/openclaw-state:ro
    ports:
      - "127.0.0.1:${ORBITFACTORY_ENGINE_HOST_PORT:?set ORBITFACTORY_ENGINE_HOST_PORT in .env}:3001"
    depends_on:
      app:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      openclaw:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:3001/readyz').then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))\""]
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 5s
    networks: [control]

  telegram:
    profiles: ["telegram"]
    build:
      context: .
      target: app
    command: ["node", "--experimental-strip-types", "src/runtime/telegram.ts"]
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:?set POSTGRES_USER in .env}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@postgres:5432/${POSTGRES_DB:?set POSTGRES_DB in .env}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
    depends_on:
      engine:
        condition: service_healthy
    networks: [control]

  # This standalone proof boundary is deliberately opt-in. Production provider
  # credentials are scoped to openclaw and coding-executor; engine and
  # tool-broker receive none.
  coding-adapter:
    profiles: ["coding-adapter"]
    build:
      context: .
      target: engine
    environment:
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:?set OPENROUTER_API_KEY in .env}
      # The proof selects its committed fake binary through its isolated
      # --env-file. Evaluators omit this optional value and use `opencode`.
      ORBITFACTORY_CODING_ADAPTER_BINARY: ${ORBITFACTORY_CODING_ADAPTER_BINARY:-opencode}
    entrypoint: ["/usr/local/bin/orbitflow-coding-adapter-entrypoint"]
    command: []
    depends_on:
      engine:
        condition: service_healthy
    networks: [control, provider]

networks:
  control: {}
  provider: {}

volumes:
  engine-data:
  run-workspaces:
  openclaw-state:
  postgres-data:
  tool-broker-ipc:
  coding-executor-ipc:
