services:
  postgres:
    image: postgres:16.8-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB in .env}
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 5s

  migrate:
    build:
      context: .
      target: app
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:?set POSTGRES_USER in .env}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@postgres:5432/${POSTGRES_DB:?set POSTGRES_DB in .env}
    command: ["npm", "run", "db:migrate"]
    depends_on:
      postgres:
        condition: service_healthy

  app:
    build:
      context: .
      target: app
    environment:
      # The inherited board still owns its SQLite foundation, while the
      # current control-plane API is PostgreSQL-backed.
      DATABASE_URL: postgresql://${POSTGRES_USER:?set POSTGRES_USER in .env}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@postgres:5432/${POSTGRES_DB:?set POSTGRES_DB in .env}
      ORBITFACTORY_DB_PATH: ${ORBITFACTORY_DB_PATH:?set ORBITFACTORY_DB_PATH in .env}
    ports:
      - "127.0.0.1:${ORBITFACTORY_APP_PORT:?set ORBITFACTORY_APP_PORT in .env}:3000"
    volumes:
      - app-data:/app/data
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:3000/api/health').then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))\""]
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 10s

  openclaw:
    build:
      context: .
      target: openclaw-gateway
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:?set POSTGRES_USER in .env}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@postgres:5432/${POSTGRES_DB:?set POSTGRES_DB in .env}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:?set OPENROUTER_API_KEY in .env}
      OPENCLAW_DISABLE_BONJOUR: "1"
      ORBITFLOW_PLATFORM_DATABASE_URL: postgresql://${POSTGRES_USER:?set POSTGRES_USER in .env}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@postgres:5432/${POSTGRES_DB:?set POSTGRES_DB in .env}
      ORBITFLOW_WORKSPACE_ROOT: /var/lib/orbitflow/run-workspaces
    volumes:
      - engine-data:/var/lib/orbitflow
      - openclaw-state:/home/node/.openclaw
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:18789/readyz').then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))\""]
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 15s

  engine:
    build:
      context: .
      target: engine
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:?set POSTGRES_USER in .env}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@postgres:5432/${POSTGRES_DB:?set POSTGRES_DB in .env}
      OPENCLAW_GATEWAY_URL: ws://openclaw:18789
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:?set OPENROUTER_API_KEY in .env}
      ORBITFLOW_RUNTIME_ROOT: /var/lib/orbitflow/runtime
      ORBITFLOW_WORKSPACE_ROOT: /var/lib/orbitflow/run-workspaces
    volumes:
      - engine-data:/var/lib/orbitflow
      - openclaw-state:/run/openclaw-state:ro
    ports:
      - "127.0.0.1:${ORBITFACTORY_ENGINE_HOST_PORT:?set ORBITFACTORY_ENGINE_HOST_PORT in .env}:3001"
    depends_on:
      app:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      openclaw:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:3001/readyz').then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))\""]
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 5s

  telegram:
    profiles: ["telegram"]
    build:
      context: .
      target: app
    command: ["node", "--experimental-strip-types", "src/runtime/telegram.ts"]
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:?set POSTGRES_USER in .env}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@postgres:5432/${POSTGRES_DB:?set POSTGRES_DB in .env}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
    depends_on:
      engine:
        condition: service_healthy

  # This is deliberately opt-in: a provider key belongs only to an ephemeral
  # coding delegation, never to the long-lived engine readiness process.
  coding-adapter:
    profiles: ["coding-adapter"]
    build:
      context: .
      target: engine
    environment:
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:?set OPENROUTER_API_KEY in .env}
      # The proof selects its committed fake binary through its isolated
      # --env-file. Evaluators omit this optional value and use `opencode`.
      ORBITFACTORY_CODING_ADAPTER_BINARY: ${ORBITFACTORY_CODING_ADAPTER_BINARY:-opencode}
    entrypoint: ["/usr/local/bin/orbitflow-coding-adapter-entrypoint"]
    command: []
    depends_on:
      engine:
        condition: service_healthy

volumes:
  app-data:
  engine-data:
  openclaw-state:
  postgres-data:
